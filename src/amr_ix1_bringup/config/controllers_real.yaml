# Controllers for running the AMR-IX1 outside Gazebo (hardware:=mock or hardware:=real).
# Same controllers and values as amr_ix1_gazebo/config/controllers.yaml, except use_sim_time.
#
# TODO (after the new mechanical design and the wheel/motor tests):
#   - wheel_radius and wheel_separation still hold the previous (Husky-matched) design values.
#   - limits (max_velocity / max_acceleration) must be re-checked against the real motors.
controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    cam_stand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

cam_stand_controller:
  ros__parameters:
    joints:
      - cam_stand_joint
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity


diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["F_L_W_joint", "B_L_W_joint"]
    right_wheel_names: ["F_R_W_joint", "B_R_W_joint"]

    # Previous design values (see TODO above)
    wheel_separation: 0.9
    wheel_radius: 0.155

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.6
        has_acceleration_limits: true
        max_acceleration: 1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.2
        has_acceleration_limits: true
        max_acceleration: 2.0
